<head>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f1117; color: #e2e8f0; height: 100vh; display: flex; flex-direction: column; }

    header {
      padding: 12px 20px;

      border-bottom: 1px solid #2d3748;
      display: flex;
      align-items: center;
      gap: 16px;

    .legend {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-left: auto;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #a0aec0;
    }
    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;

    #map { flex: 1; }

    /* Leaflet popup overrides */
    .leaflet-popup-content-wrapper {
      background: #1a1d27;
      border: 1px solid #2d3748;
      border-radius: 10px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      color: #e2e8f0;
      padding: 0;
    }
    .leaflet-popup-content {
      margin: 0;
      min-width: 240px;
      max-width: 300px;
    }
    .leaflet-popup-tip { background: #1a1d27; }
    .leaflet-popup-close-button { color: #718096 !important; top: 8px !important; right: 10px !important; }

    .popup-inner { padding: 14px 16px; }
    .popup-tag {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 2px 8px;
      border-radius: 20px;
      margin-bottom: 8px;
    }
    .popup-name {
      font-size: 14px;
      font-weight: 600;
      color: #f7fafc;
      line-height: 1.3;
      margin-bottom: 6px;
    }
    .popup-meta {
      display: flex;
      gap: 10px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .popup-score {
      font-size: 13px;
      font-weight: 700;
      color: #68d391;
    }
    .popup-price {
      font-size: 13px;
      color: #90cdf4;
    }
    .popup-note {
      font-size: 12px;
      color: #718096;
      margin-bottom: 10px;
      line-height: 1.4;
    }
    .popup-link {
      display: inline-block;
      font-size: 12px;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 6px;
      text-decoration: none;
      transition: opacity 0.15s;
    }
    .popup-link:hover { opacity: 0.8; }

    /* category colors */
    .cat-priorat    { background: #553c9a; color: #e9d8fd; }
    .cat-tarragona  { background: #744210; color: #fefcbf; }
    .cat-salou      { background: #1a365d; color: #bee3f8; }
    .cat-cambrils   { background: #1c4532; color: #c6f6d5; }
    .cat-airbnb     { background: #742a2a; color: #fed7d7; }

    .link-booking { background: #003580; color: #fff; }

<div id="map"></div>

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '© OpenStreetMap contributors © CARTO',
  maxZoom: 19
}).addTo(map);

function makeIcon(color, size = 14) {
  return L.divIcon({
    className: '',
    html: `<svg width="${size+8}" height="${size+8}" viewBox="0 0 22 22" xmlns="http://www.w3.org/2000/svg">
      <circle cx="11" cy="11" r="9" fill="${color}" stroke="rgba(255,255,255,0.35)" stroke-width="2"/>
    </svg>`,
    iconSize: [size+8, size+8],
    iconAnchor: [(size+8)/2, (size+8)/2],
    popupAnchor: [0, -(size+8)/2]
  });
}

function popup(cat, name, score, price, note, url, platform) {
  const tagClass = `cat-${cat}`;
  const linkClass = platform === 'airbnb' ? 'link-airbnb' : 'link-booking';
  const catLabel = { priorat: '🍷 Priorat', tarragona: '🏛 Tarragona', salou: '🏖 Salou', cambrils: '⛵ Cambrils', airbnb: '✨ Airbnb Unique' }[cat];
  return `<div class="popup-inner">
    <div class="popup-tag ${tagClass}">${catLabel}</div>
    <div class="popup-name">${name}</div>
    <div class="popup-meta">
      ${score ? `<span class="popup-score">★ ${score}</span>` : ''}
      ${price ? `<span class="popup-price">€${price} total</span>` : ''}
    </div>
    ${note ? `<div class="popup-note">${note}</div>` : ''}
    <a href="${url}" target="_blank" class="popup-link ${linkClass}">View →</a>
  </div>`;
}

  const platform = s.platform || 'booking';
  const marker = L.marker([s.lat, s.lng], { icon: makeIcon(s.color, s.size || 14) }).addTo(map);
  marker.bindPopup(popup(s.cat, s.name, s.score, s.price, s.note, s.url, platform), {
    maxWidth: 320,
    className: 'custom-popup'
  });
